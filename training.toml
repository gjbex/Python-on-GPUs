schema_version = 2
id = "python-on-gpus"
title = "Python on GPUs"
content_language = "en"
summary = """
The Python programming language is increasingly popular. It is a versatile language for general purpose programming and accessible for novice programmers. However, it is also increasingly used for scientific computing and can be used to develop code that runs on GPGPUs. Additionally, a number of libraries that are commonly used in scientific computing, data science and machine learning can use GPGPUs to improve performance.
"""
languages = ["Python"]

[[learning_outcomes]]
statement = "Have an understanding of the architecture and features of GPGPUs."
competencies = ["gpu-computing.architecture-and-programming-model"]

[[learning_outcomes]]
statement = "Be able to transfer data between the host and the GPGPU device."
competencies = ["gpu-computing.transfer-host-and-device-data"]

[[learning_outcomes]]
statement = "Be able to do linear algebra computations on GPGPUs using scikit-cuda."
competencies = ["gpu-computing.use-accelerated-libraries"]

[[learning_outcomes]]
statement = "Be able to generate random numbers on a GPGPU using curand."
competencies = ["gpu-computing.use-accelerated-libraries"]

[[learning_outcomes]]
statement = "Be able to define your own kernels to run on GPGPUs."
competencies = ["gpu-computing.write-custom-kernels"]

[[learning_outcomes]]
statement = "Use numba to generate kernels to run on GPGPUs."
competencies = ["gpu-computing.generate-kernels-with-numba"]

[[learning_outcomes]]
statement = "Run machine learning algorithms on GPGPUs."
competencies = ["gpu-computing.use-accelerated-libraries"]

[[learning_outcomes]]
statement = "Speed up data science tasks using Rapids."
competencies = ["gpu-computing.use-accelerated-libraries"]

[source]
metadata_document = "docs/README.md"
repository_url = "https://github.com/gjbex/Python-on-GPUs/"
website_url = "https://gjbex.github.io/Python-on-GPUs/"
license = "CC-BY-4.0"

[delivery]
duration_minutes = 240
duration_kind = "fixed"
session_count = 1
target_session_duration_minutes = 240
schedule_complete = true
description = """
Total duration: 4 hours.
"""

[audience]
description = """
This training is for you if you speed up your Python by using GPUs.
"""

[prerequisites]
summary = """
You will need experience programming in Python. This is not a training that starts from scratch. Some familiarity with numpy is required as well. If you plan to do Python GPU programming in a Linux or HPC environment (and you should), then familiarity with these environments is required as well. More concretely, participants should already be comfortable with the following: * running Python code in Jupyter or from the command line; * variables, numbers, strings, booleans, and basic containers such as lists and dictionaries; * `if`/`else` statements, `for` loops, and writing simple functions; * importing modules and reading short Python scripts without needing every line explained; * basic NumPy array operations such as creating arrays, reshaping them, slicing them, and applying vectorized computations; * basic linear algebra with NumPy, for example matrix multiplication and reductions such as sums or means; * reading and making small changes to short numerical Python scripts or notebooks; * basic familiarity with Linux or HPC workflows if you want to run the code on remote GPU systems. You do not need prior experience with PyCUDA, CuPy, cuPyNumeric, Numba GPU programming, cuRAND, RAPIDS, or custom CUDA kernels. Those are part of the training itself.
"""
competencies = ["python.run-code", "python.values-and-containers", "python.control-flow-and-comprehensions", "python.functions", "python.import-modules", "numpy.create-slice-and-reshape-arrays", "numpy.vectorized-computations", "numpy.reductions", "numpy.basic-linear-algebra"]

[self_assessment]
introduction = """
If you can do most of the tasks below without looking up basic Python syntax, you are likely ready for this training.
"""
tasks = [
  "Create a NumPy array, compute a slice from it, and calculate its sum or mean.",
  "Multiply two matrices with NumPy and interpret the shape of the result.",
  "Read a short script that imports `numpy`, builds arrays, and times a computation.",
  "Write a function that applies a simple numerical formula to all elements of an array.",
  "Explain the difference between a Python loop over elements and a vectorized array operation at a high level.",
  "Make a small change to an example notebook or script and run it again.",
  "Read a short traceback or runtime error and identify roughly where the problem occurred.",
  "Run a Python script from the command line with one or two arguments."
]

[requirements]
software = [
  "Laptop or desktop with internet access.",
  "A system set up so you can connect to an HPC system, an account on an HPC system (e.g., VSC, CECI, ...), compute credits if that is required to run jobs on the HPC system if you want to use an HPC system.",
  "A Python environment that can run Jupyter Lab if you want to use your own system (this will only work if your system has an NVIDIA GPU and the required software installed).",
  "Access to Google Colaboratory if you prefer not to install software."
]

[level]
introductory_percent = 10
intermediate_percent = 35
advanced_percent = 55
description = """
For participants who already have basic Python and NumPy experience, the material in this training is approximately These percentages describe the level of the GPU programming and accelerated computing topics covered in the training, not the required entry level in Python itself.
"""

[[materials]]
